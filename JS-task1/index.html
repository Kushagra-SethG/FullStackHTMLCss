<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task1 - Quiz</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; }
        button { display: block; width: 100%; margin: 10px 0; padding: 10px; cursor: pointer; font-size: 16px; }
        .hidden { display: none; }
        .correct { background-color: #4CAF50; color: white; }
        .wrong { background-color: #f44336; color: white; }
        .disabled { pointer-events: none; opacity: 0.8; }
        #header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 20px; }
        #explanation { margin: 15px 0; padding: 10px; background: #e9e9e9; border-left: 4px solid #333; }
        .review-item { border-bottom: 1px solid #ccc; padding-bottom: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="quiz-screen">
        <div id="header">
            <span id="progress">Q 1/3</span>
            <span id="timer">Time: 30s</span>
            <span id="score-display">Score: 0</span>
        </div>
        
        <h2 id="question-text">Question goes here</h2>
        
        <div id="options-container"></div>
        
        <div id="explanation" class="hidden"></div>
        
        <button id="next-btn" class="hidden" onclick="nextQuestion()">Next Question</button>
    </div>

    <div id="end-screen" class="hidden">
        <h2>Quiz Complete!</h2>
        <p>Final Score: <span id="final-score"></span></p>
        <p id="rating-message"></p>
        <button onclick="showReview()">Review Wrong Answers</button>
        <button onclick="restartQuiz()">Restart Quiz</button>
    </div>
    <div id="review-screen" class="hidden">
        <h2>Wrong Answers Review</h2>
        <div id="review-list"></div>
        <button onclick="restartQuiz()">Restart Quiz</button>
    </div>

    <script src="index.js"></script>
</body>
</html>
