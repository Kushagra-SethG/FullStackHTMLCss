<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Armstrong Number Checker</title>
    </head>
    <body>
        <main>
            <h1>Armstrong Number Checker</h1>
            <label for="number-input">Enter a non-negative integer:</label>
            <input id="number-input" type="number" min="0" step="1">
            <button id="check-button" type="button">Check Armstrong</button>
            <p id="result" role="status" aria-live="polite"></p>
        </main>
        <script src="index.js"></script>
    </body>
</html>
